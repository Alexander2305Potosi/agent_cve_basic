version: '3.8'

services:
  ms-upload-documents:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-upload-documents
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - EXTERNAL_SOAP_SERVICE_URL=http://mock-soap:8081/ws/documents
    networks:
      - supplier-network

  mock-soap:
    image: mockserver/mockserver:latest
    container_name: mock-soap-service
    ports:
      - "8081:8081"
    environment:
      - MOCKSERVER_SERVER_PORT=8081
    networks:
      - supplier-network

networks:
  supplier-network:
    driver: bridge
