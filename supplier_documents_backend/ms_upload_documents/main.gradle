allprojects {
    // Las variables de versión vienen de build.gradle (buildscript.ext)
    // NO redefinir variables CVE aquí - solo se definen en build.gradle
    apply from: "${rootDir}/dependencyMgmt.gradle"
    group = 'com.supplier.documents'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'jacoco'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.check.dependsOn jacocoTestCoverageVerification
