spring:
  application:
    name: ms-upload-documents
  main:
    web-application-type: reactive
  webflux:
    base-path: /api/v1

server:
  port: 8080
  netty:
    connection-timeout: 30s
    idle-timeout: 60s

# External SOAP Service Configuration
external:
  soap:
    service:
      url: ${EXTERNAL_SOAP_URL:http://localhost:8081/ws/documents}
      username: ${EXTERNAL_SOAP_USERNAME:}
      password: ${EXTERNAL_SOAP_PASSWORD:}
      timeout:
        connection: ${EXTERNAL_CONNECTION_TIMEOUT:30000}
        read: ${EXTERNAL_READ_TIMEOUT:60000}

# Logging
logging:
  level:
    com.supplier.documents.upload: DEBUG
    org.springframework.web.reactive: INFO
    reactor.netty: INFO
    org.apache.cxf: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Application Settings
app:
  document:
    max-size: 10485760  # 10MB in bytes
    allowed-types:
      - application/pdf
      - image/jpeg
      - image/png
      - application/xml
      - text/xml
  security:
    enabled: false

# SpringDoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  show-actuator: true
